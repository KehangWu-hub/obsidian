<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">std::queue 先进先出示意</title>
  <desc id="desc">以简约学术风格展示 queue 从队尾入队、从队头出队的先进先出特性。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#356a9a"/>
    </marker>
    <style>
      .sans{font-family:"Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif}
      .mono{font-family:"JetBrains Mono","Cascadia Mono",Consolas,monospace}
      .ink{fill:#172033}.muted{fill:#64748b}.blue{fill:#356a9a}
      .rule{stroke:#334155;stroke-width:2;fill:none}.guide{stroke:#94a3b8;stroke-width:1.6;fill:none}
      .arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .arrow-blue{stroke:#356a9a;stroke-width:2;fill:none;marker-end:url(#arrowBlue)}
    </style>
  </defs>

  <rect width="1600" height="520" fill="#ffffff"/>

  <!-- Queue elements -->
  <g stroke="#334155" stroke-width="2">
    <rect x="500" y="190" width="200" height="112" fill="#eef4f8"/>
    <rect x="700" y="190" width="200" height="112" fill="#f8fafc"/>
    <rect x="900" y="190" width="200" height="112" fill="#eef4f8"/>
  </g>
  <g text-anchor="middle" class="mono ink" font-size="34">
    <text x="600" y="258">A</text>
    <text x="800" y="258">B</text>
    <text x="1000" y="258">C</text>
  </g>
  <g text-anchor="middle" class="sans muted" font-size="17">
    <text x="600" y="333">最早入队</text>
    <text x="1000" y="333">最晚入队</text>
  </g>

  <!-- Front and back access -->
  <text x="600" y="68" text-anchor="middle" class="mono blue" font-size="24">front()</text>
  <text x="600" y="97" text-anchor="middle" class="sans muted" font-size="18">访问队头 A</text>
  <path d="M600 110V177" class="arrow-blue"/>

  <text x="1000" y="68" text-anchor="middle" class="mono blue" font-size="24">back()</text>
  <text x="1000" y="97" text-anchor="middle" class="sans muted" font-size="18">访问队尾 C</text>
  <path d="M1000 110V177" class="arrow-blue"/>

  <!-- Pop at front -->
  <path d="M490 246H300" class="arrow"/>
  <text x="270" y="228" text-anchor="end" class="mono ink" font-size="24">pop()</text>
  <text x="270" y="259" text-anchor="end" class="sans muted" font-size="18">从队头出队</text>

  <!-- Push at back -->
  <path d="M1300 246H1110" class="arrow-blue"/>
  <text x="1330" y="228" class="mono blue" font-size="24">push(x)</text>
  <text x="1330" y="259" class="sans muted" font-size="18">从队尾入队</text>

  <!-- FIFO order -->
  <text x="190" y="372" class="sans ink" font-size="22" font-weight="600">入队顺序</text>
  <text x="190" y="418" class="mono blue" font-size="28">A → B → C</text>

  <text x="560" y="372" class="sans ink" font-size="22" font-weight="600">出队顺序</text>
  <text x="560" y="418" class="mono blue" font-size="28">A → B → C</text>
  <text x="560" y="458" class="sans muted" font-size="19">First In, First Out</text>

  <!-- Size state -->
  <line x1="1080" y1="370" x2="1080" y2="466" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1120" y="402" class="mono ink" font-size="23">size() = 3</text>
  <text x="1120" y="449" class="mono ink" font-size="23">empty() = false</text>
</svg>
