<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">std::vector 常用操作</title>
  <desc id="desc">以简约学术风格展示 vector 的元素访问、迭代器边界及尾部增删操作。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#356a9a"/>
    </marker>
    <style>
      .sans{font-family:"Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif}
      .mono{font-family:"JetBrains Mono","Cascadia Mono",Consolas,monospace}
      .ink{fill:#172033}.muted{fill:#64748b}.blue{fill:#356a9a}
      .rule{stroke:#334155;stroke-width:2;fill:none}.guide{stroke:#94a3b8;stroke-width:1.6;fill:none}
      .arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .arrow-blue{stroke:#356a9a;stroke-width:2;fill:none;marker-end:url(#arrowBlue)}
    </style>
  </defs>

  <rect width="1600" height="820" fill="#ffffff"/>

  <!-- Header -->
  <text x="130" y="92" class="mono ink" font-size="38" font-weight="650">std::vector</text>
  <text x="377" y="92" class="sans muted" font-size="30">常用操作示意</text>
  <line x1="130" y1="122" x2="1470" y2="122" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1470" y="92" text-anchor="end" class="sans muted" font-size="20">连续存储 · 随机访问</text>

  <!-- Element access labels -->
  <text x="370" y="190" text-anchor="middle" class="mono blue" font-size="25">front()</text>
  <text x="370" y="220" text-anchor="middle" class="sans muted" font-size="18">首元素</text>
  <path d="M370 230V276" class="arrow-blue"/>

  <text x="1130" y="190" text-anchor="middle" class="mono blue" font-size="25">back()</text>
  <text x="1130" y="220" text-anchor="middle" class="sans muted" font-size="18">尾元素</text>
  <path d="M1130 230V276" class="arrow-blue"/>

  <!-- Vector cells -->
  <text x="190" y="344" class="mono ink" font-size="23">v</text>
  <g stroke="#334155" stroke-width="2">
    <rect x="290" y="285" width="160" height="112" fill="#eef4f8"/>
    <rect x="450" y="285" width="160" height="112" fill="#f8fafc"/>
    <rect x="610" y="285" width="160" height="112" fill="#f8fafc"/>
    <rect x="770" y="285" width="160" height="112" fill="#f8fafc"/>
    <rect x="930" y="285" width="160" height="112" fill="#f8fafc"/>
    <rect x="1090" y="285" width="160" height="112" fill="#eef4f8"/>
  </g>
  <g text-anchor="middle" class="mono ink" font-size="33">
    <text x="370" y="352">1</text><text x="530" y="352">2</text><text x="690" y="352">3</text>
    <text x="850" y="352">4</text><text x="1010" y="352">5</text><text x="1170" y="352">6</text>
  </g>
  <g text-anchor="middle" class="mono muted" font-size="17">
    <text x="370" y="427">0</text><text x="530" y="427">1</text><text x="690" y="427">2</text>
    <text x="850" y="427">3</text><text x="1010" y="427">4</text><text x="1170" y="427">5</text>
  </g>

  <!-- Boundary ticks -->
  <line x1="290" y1="267" x2="290" y2="415" class="rule"/>
  <line x1="1250" y1="267" x2="1250" y2="415" class="rule"/>

  <!-- Iterators -->
  <path d="M370 510V405" class="arrow"/>
  <text x="370" y="548" text-anchor="middle" class="mono ink" font-size="23">v.begin()</text>
  <text x="370" y="577" text-anchor="middle" class="sans muted" font-size="18">指向首元素</text>

  <path d="M1250 510V405" class="arrow"/>
  <text x="1250" y="548" text-anchor="middle" class="mono ink" font-size="23">v.end()</text>
  <text x="1250" y="577" text-anchor="middle" class="sans muted" font-size="18">尾后位置</text>

  <path d="M1170 650V405" class="arrow-blue"/>
  <text x="1170" y="688" text-anchor="middle" class="mono blue" font-size="23">v.rbegin()</text>
  <text x="1170" y="717" text-anchor="middle" class="sans muted" font-size="18">反向迭代的起点</text>

  <path d="M290 650V405" class="arrow-blue"/>
  <text x="290" y="688" text-anchor="middle" class="mono blue" font-size="23">v.rend()</text>
  <text x="290" y="717" text-anchor="middle" class="sans muted" font-size="18">反向迭代的终点</text>

  <!-- Insert -->
  <path d="M770 510V405" class="arrow-blue"/>
  <text x="770" y="548" text-anchor="middle" class="mono blue" font-size="23">insert(pos, x)</text>
  <text x="770" y="577" text-anchor="middle" class="sans muted" font-size="18">在 pos 前插入，后续元素后移</text>

  <!-- Tail operations -->
  <line x1="1320" y1="246" x2="1320" y2="436" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1370" y="300" class="mono ink" font-size="23">push_back(x)</text>
  <text x="1370" y="330" class="sans muted" font-size="18">尾部添加</text>
  <path d="M1360 344H1260" class="arrow"/>

  <text x="1370" y="397" class="mono ink" font-size="23">pop_back()</text>
  <text x="1370" y="427" class="sans muted" font-size="18">尾部删除</text>
  <path d="M1260 441H1360" class="arrow"/>

  <!-- Footnote -->
  <line x1="130" y1="765" x2="1470" y2="765" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="130" y="797" class="sans muted" font-size="18">注：end() 与 rend() 表示边界位置，不指向有效元素。</text>
</svg>
