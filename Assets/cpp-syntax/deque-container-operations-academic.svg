<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 145 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">std::deque 双端操作</title>
  <desc id="desc">以简约学术风格展示 deque 的头尾访问、双端增删、中间插入与迭代器边界。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#356a9a"/>
    </marker>
    <style>
      .sans{font-family:"Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif}
      .mono{font-family:"JetBrains Mono","Cascadia Mono",Consolas,monospace}
      .ink{fill:#172033}.muted{fill:#64748b}.blue{fill:#356a9a}
      .rule{stroke:#334155;stroke-width:2;fill:none}.guide{stroke:#94a3b8;stroke-width:1.6;fill:none}
      .arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .arrow-blue{stroke:#356a9a;stroke-width:2;fill:none;marker-end:url(#arrowBlue)}
    </style>
  </defs>

  <rect width="1600" height="820" fill="#ffffff"/>

  <!-- Element access -->
  <text x="445" y="190" text-anchor="middle" class="mono blue" font-size="25">front()</text>
  <text x="445" y="220" text-anchor="middle" class="sans muted" font-size="18">访问首元素</text>
  <path d="M445 230V276" class="arrow-blue"/>

  <text x="1155" y="190" text-anchor="middle" class="mono blue" font-size="25">back()</text>
  <text x="1155" y="220" text-anchor="middle" class="sans muted" font-size="18">访问尾元素</text>
  <path d="M1155 230V276" class="arrow-blue"/>

  <!-- Deque cells -->
  <text x="200" y="350" class="mono ink" font-size="23">d</text>
  <g stroke="#334155" stroke-width="2">
    <rect x="365" y="285" width="160" height="112" fill="#eef4f8"/>
    <rect x="525" y="285" width="160" height="112" fill="#f8fafc"/>
    <rect x="685" y="285" width="160" height="112" fill="#f8fafc"/>
    <rect x="845" y="285" width="160" height="112" fill="#f8fafc"/>
    <rect x="1005" y="285" width="160" height="112" fill="#eef4f8"/>
  </g>
  <g text-anchor="middle" class="mono ink" font-size="33">
    <text x="445" y="352">1</text><text x="605" y="352">2</text><text x="765" y="352">3</text>
    <text x="925" y="352">4</text><text x="1085" y="352">5</text>
  </g>
  <g text-anchor="middle" class="mono muted" font-size="17">
    <text x="445" y="427">0</text><text x="605" y="427">1</text><text x="765" y="427">2</text>
    <text x="925" y="427">3</text><text x="1085" y="427">4</text>
  </g>

  <!-- Front operations -->
  <text x="160" y="278" class="mono ink" font-size="23">push_front(x)</text>
  <text x="160" y="308" class="sans muted" font-size="18">头部添加</text>
  <path d="M300 324H355" class="arrow"/>

  <text x="160" y="393" class="mono ink" font-size="23">pop_front()</text>
  <text x="160" y="423" class="sans muted" font-size="18">头部删除</text>
  <path d="M355 439H300" class="arrow"/>

  <!-- Back operations -->
  <text x="1250" y="278" class="mono ink" font-size="23">push_back(x)</text>
  <text x="1250" y="308" class="sans muted" font-size="18">尾部添加</text>
  <path d="M1235 324H1175" class="arrow"/>

  <text x="1250" y="393" class="mono ink" font-size="23">pop_back()</text>
  <text x="1250" y="423" class="sans muted" font-size="18">尾部删除</text>
  <path d="M1175 439H1235" class="arrow"/>

  <!-- Iterator boundaries -->
  <path d="M445 535V405" class="arrow"/>
  <text x="445" y="574" text-anchor="middle" class="mono ink" font-size="23">d.begin()</text>
  <text x="445" y="603" text-anchor="middle" class="sans muted" font-size="18">指向首元素</text>

  <path d="M1165 535V405" class="arrow"/>
  <text x="1165" y="574" text-anchor="middle" class="mono ink" font-size="23">d.end()</text>
  <text x="1165" y="603" text-anchor="middle" class="sans muted" font-size="18">指向尾后位置</text>

  <!-- Insert -->
  <path d="M765 535V405" class="arrow-blue"/>
  <text x="765" y="574" text-anchor="middle" class="mono blue" font-size="23">insert(pos, x)</text>
  <text x="765" y="603" text-anchor="middle" class="sans muted" font-size="18">在 pos 前插入</text>

  <!-- Erase -->
  <path d="M925 658V405" class="arrow-blue"/>
  <text x="925" y="696" text-anchor="middle" class="mono blue" font-size="23">erase(pos)</text>
  <text x="925" y="725" text-anchor="middle" class="sans muted" font-size="18">删除 pos 指向的元素</text>

</svg>
