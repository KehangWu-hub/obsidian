<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">C++ 三种继承方式下的成员访问权限</title>
  <desc id="desc">展示 public、protected 和 private 继承对基类成员访问权限的影响。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#334155"/>
    </marker>
    <style>
      .sans{font-family:"Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",Arial,sans-serif}
      .mono{font-family:"JetBrains Mono","Cascadia Mono",Consolas,monospace}
      .ink{fill:#172033}.muted{fill:#64748b}.blue{fill:#356a9a}.red{fill:#a04444}
      .box{fill:#fff;stroke:#334155;stroke-width:2}.head{fill:#eef4f8}
      .rule{stroke:#cbd5e1;stroke-width:1.5}.branch{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="920" fill="#fff"/>

  <!-- Header -->
  <text x="110" y="78" class="mono ink" font-size="37" font-weight="650">C++</text>
  <text x="205" y="78" class="sans muted" font-size="30">继承访问权限</text>
  <text x="1490" y="78" text-anchor="end" class="sans muted" font-size="20">基类成员在派生类中的权限变化</text>
  <line x1="110" y1="108" x2="1490" y2="108" class="rule"/>

  <!-- Base class -->
  <rect x="580" y="150" width="440" height="224" class="box"/>
  <rect x="580" y="150" width="440" height="58" class="head" stroke="#334155" stroke-width="2"/>
  <text x="800" y="188" text-anchor="middle" class="mono ink" font-size="25" font-weight="650">class Base</text>
  <text x="625" y="250" class="mono blue" font-size="22">public</text>
  <text x="825" y="250" class="mono ink" font-size="22">int a;</text>
  <text x="625" y="300" class="mono blue" font-size="22">protected</text>
  <text x="825" y="300" class="mono ink" font-size="22">int b;</text>
  <text x="625" y="350" class="mono blue" font-size="22">private</text>
  <text x="825" y="350" class="mono ink" font-size="22">int c;</text>

  <!-- Uniform inheritance branches -->
  <path d="M800 374V420H315V485" class="branch"/>
  <path d="M800 374V485" class="branch"/>
  <path d="M800 374V420H1285V485" class="branch"/>

  <!-- Public inheritance -->
  <text x="315" y="458" text-anchor="middle" class="sans ink" font-size="22" font-weight="600">公共继承</text>
  <rect x="110" y="500" width="410" height="310" class="box"/>
  <rect x="110" y="500" width="410" height="72" class="head" stroke="#334155" stroke-width="2"/>
  <text x="315" y="531" text-anchor="middle" class="mono ink" font-size="20">class Derived</text>
  <text x="315" y="558" text-anchor="middle" class="mono blue" font-size="19">: public Base</text>
  <text x="150" y="622" class="mono blue" font-size="21">public</text>
  <text x="340" y="622" class="mono ink" font-size="21">a</text>
  <line x1="150" y1="642" x2="480" y2="642" class="rule"/>
  <text x="150" y="686" class="mono blue" font-size="21">protected</text>
  <text x="340" y="686" class="mono ink" font-size="21">b</text>
  <line x1="150" y1="706" x2="480" y2="706" class="rule"/>
  <text x="150" y="750" class="sans red" font-size="20">不可直接访问</text>
  <text x="340" y="750" class="mono muted" font-size="21">c</text>
  <text x="315" y="852" text-anchor="middle" class="sans muted" font-size="18">public → public · protected → protected</text>

  <!-- Protected inheritance -->
  <text x="800" y="458" text-anchor="middle" class="sans ink" font-size="22" font-weight="600">保护继承</text>
  <rect x="595" y="500" width="410" height="310" class="box"/>
  <rect x="595" y="500" width="410" height="72" class="head" stroke="#334155" stroke-width="2"/>
  <text x="800" y="531" text-anchor="middle" class="mono ink" font-size="20">class Derived</text>
  <text x="800" y="558" text-anchor="middle" class="mono blue" font-size="19">: protected Base</text>
  <text x="635" y="622" class="mono blue" font-size="21">protected</text>
  <text x="825" y="622" class="mono ink" font-size="21">a</text>
  <line x1="635" y1="642" x2="965" y2="642" class="rule"/>
  <text x="635" y="686" class="mono blue" font-size="21">protected</text>
  <text x="825" y="686" class="mono ink" font-size="21">b</text>
  <line x1="635" y1="706" x2="965" y2="706" class="rule"/>
  <text x="635" y="750" class="sans red" font-size="20">不可直接访问</text>
  <text x="825" y="750" class="mono muted" font-size="21">c</text>
  <text x="800" y="852" text-anchor="middle" class="sans muted" font-size="18">public / protected → protected</text>

  <!-- Private inheritance -->
  <text x="1285" y="458" text-anchor="middle" class="sans ink" font-size="22" font-weight="600">私有继承</text>
  <rect x="1080" y="500" width="410" height="310" class="box"/>
  <rect x="1080" y="500" width="410" height="72" class="head" stroke="#334155" stroke-width="2"/>
  <text x="1285" y="531" text-anchor="middle" class="mono ink" font-size="20">class Derived</text>
  <text x="1285" y="558" text-anchor="middle" class="mono blue" font-size="19">: private Base</text>
  <text x="1120" y="622" class="mono blue" font-size="21">private</text>
  <text x="1310" y="622" class="mono ink" font-size="21">a</text>
  <line x1="1120" y1="642" x2="1450" y2="642" class="rule"/>
  <text x="1120" y="686" class="mono blue" font-size="21">private</text>
  <text x="1310" y="686" class="mono ink" font-size="21">b</text>
  <line x1="1120" y1="706" x2="1450" y2="706" class="rule"/>
  <text x="1120" y="750" class="sans red" font-size="20">不可直接访问</text>
  <text x="1310" y="750" class="mono muted" font-size="21">c</text>
  <text x="1285" y="852" text-anchor="middle" class="sans muted" font-size="18">public / protected → private</text>

  <line x1="110" y1="884" x2="1490" y2="884" class="rule"/>
  <text x="110" y="913" class="sans muted" font-size="17">注：基类 private 成员属于派生对象的一部分，但派生类不能直接访问。</text>
</svg>
